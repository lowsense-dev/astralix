name: Test astralix-tl
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - run: uv venv --python 3.12 .venv
      - run: uv build --wheel
      - run: uv pip install --python .venv/bin/python dist/*.whl aiohttp
      - run: .venv/bin/python -I -m unittest discover -s tests -v
      - run: .venv/bin/python -I -O -m unittest discover -s tests -v
