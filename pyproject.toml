# © LowSense, 2026 · GNU AGPLv3
[project]
name = "astralix"
version = "1.1.1"
description = "astralix Userbot"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "astralix-tl==1.0.0",
    "pyaes",
    "gitpython==3.1.60",
    "deep-translator==1.11.4",
    "meval==2.5",
    "aiohttp==3.14.3",
    "cryptography==50.0.1",
    "requests==2.33.1",
    "certifi==2024.8.30",
    "grapheme==0.6.0",
    "emoji>=1.7",
    "psutil==6.0.0",
    "TgCrypto-pyrofork",
    "rsa==4.9",
    "ruamel.yaml==0.17.21",
    "orjson",
    "Pillow",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
media = ["moviepy", "python-ffmpeg", "ffmpeg", "bs4"]
speedups = ["uvloop; sys_platform != 'win32'"]

[project.urls]
Source = "https://git.astralix.cc/lowsense-dev/astralix"
Homepage = "https://astralix.cc"

[tool.uv]
package = false
